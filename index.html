<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Bestiari Tàctil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101917">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: menú de fitxes de camp en graella (2 columnes al mòbil); cada escena a pantalla completa amb controls flotants translúcids */
:root{
  --bg:#101917; --surface:#18241f; --line:#2b3b34; --fg:#eeeadb; --muted:#a2ab9b; --accent:#f0b648; --on-accent:#2a1d05;
  --chip:rgba(12,18,16,.62);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --latin:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#menu{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 32px) calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:12px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,64px);line-height:.92;letter-spacing:-.025em;margin:0;text-wrap:balance}
header h1 em{font-style:normal;color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:16px;line-height:1.5;max-width:38ch}
section{display:flex;flex-direction:column;gap:14px}
section h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.card{appearance:none;border:0;background:none;text-align:left;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{display:block;width:100%;max-width:100%;aspect-ratio:3/2;height:auto;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:transform .18s ease}
.card:active .thumb{transform:scale(.97)}
.card:focus-visible{outline:none}
.card:focus-visible .thumb{box-shadow:0 0 0 2px var(--accent)}
.meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.meta b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.15}
.meta i{font-family:var(--latin);color:var(--muted);font-size:16px;line-height:1.1}
.meta span{font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:3px}
footer{color:var(--muted);font-size:13.5px;line-height:1.5;border-top:1px solid var(--line);padding-top:16px}

#scene{position:fixed;inset:0;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top>button{pointer-events:auto}
.ibtn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:700;font-size:18px}
.ibtn svg{width:20px;height:20px}
.ttl{flex:0 1 auto;margin-right:auto;min-width:0;display:flex;flex-direction:column;justify-content:center;height:44px;padding:0 16px;border-radius:22px;background:var(--chip);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ttl b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl i{font-family:var(--latin);font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.pill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:max(16px,env(safe-area-inset-left,0px));padding:6px 12px;border-radius:999px;background:var(--chip);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;font-variant-numeric:tabular-nums;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);transform:translate(-50%,10px);width:min(420px,calc(100% - 32px));padding:12px 16px;border-radius:14px;background:rgba(16,25,23,.88);border:1px solid var(--line);font-size:15px;line-height:1.45;text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottom>*{pointer-events:auto}
.seg{display:flex;padding:4px;gap:4px;border-radius:999px;background:var(--chip);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg:empty,.acts:empty{display:none}
.seg button{border:0;border-radius:999px;padding:0 16px;height:40px;font-weight:700;font-size:14px;background:transparent;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.acts{display:flex;gap:8px}
.acts button{border:0;border-radius:999px;padding:0 18px;height:48px;font-weight:700;font-size:14px;background:var(--chip);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
@media (prefers-reduced-motion:reduce){.thumb,.toast{transition:none}}
</style>
</head>
<body>

<div id="menu">
  <div class="wrap">
    <header>
      <h1>Bestiari <em>Tàctil</em></h1>
      <p>Onze escenaris amb animals que reaccionen al teu dit. Toca, arrossega i mira què fan.</p>
    </header>
    <div id="groups" class="wrap" style="gap:32px"></div>
    <footer>Funciona millor al mòbil i amb diversos dits alhora. Cada escena té un botó <b>?</b> que explica què pots fer.</footer>
  </div>
</div>

<div id="scene" hidden>
  <canvas id="cv"></canvas>
  <div class="top">
    <button id="back" class="ibtn" aria-label="Tornar al menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><b id="sname"></b><i id="slatin"></i></div>
    <button id="info" class="ibtn" aria-label="Com funciona">?</button>
    <button id="reset" class="ibtn" aria-label="Reiniciar l'escena"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
  </div>
  <div id="stats" class="pill" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="bottom"><div id="tools" class="seg" role="group" aria-label="Eines"></div><div id="acts" class="acts"></div></div>
</div>

<script>
(()=>{
'use strict';
// ───────────── utilitats
const TAU=Math.PI*2;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];
const lerpAng=(a,b,t)=>{const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t};
const pl=(n,s,p)=>`${n} ${n===1?s:p}`;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function prune(a,f){let j=0;for(let i=0;i<a.length;i++)if(!f(a[i]))a[j++]=a[i];a.length=j}
function limit(b,min,max){const s=Math.hypot(b.vx,b.vy);if(s>max){const k=max/s;b.vx*=k;b.vy*=k;return max}
  if(s<min){if(s<1e-6){const a=rnd(TAU);b.vx=Math.cos(a)*min;b.vy=Math.sin(a)*min}else{const k=min/s;b.vx*=k;b.vy*=k}return min}return s}
function softBounds(b,W,H,m,k){if(b.x<m)b.ax+=(m-b.x)*k;else if(b.x>W-m)b.ax-=(b.x-W+m)*k;if(b.y<m)b.ay+=(m-b.y)*k;else if(b.y>H-m)b.ay-=(b.y-H+m)*k}
// transformació local (rotació + escala) que respecta el DPR
function T(c,d,x,y,a,s=1){const co=Math.cos(a)*d*s,si=Math.sin(a)*d*s;c.setTransform(co,si,-si,co,x*d,y*d)}
const E=(c,x,y,rx,ry)=>{c.moveTo(x+rx,y);c.ellipse(x,y,rx,ry,0,0,TAU)};
const O=(c,x,y,r)=>{c.moveTo(x+r,y);c.arc(x,y,r,0,TAU)};
function offscreen(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function layer(W,H,d,fn){const cv=offscreen(W*d,H*d),b=cv.getContext('2d');b.scale(d,d);fn(b);return cv}
function blob(b,x,y,r,rgb,a){const g=b.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);b.fillStyle=g;b.fillRect(x-r,y-r,r*2,r*2)}
function speckle(b,W,H,n,cols,r0,r1){for(const col of cols){b.fillStyle=col;b.beginPath();for(let i=0;i<n/cols.length;i++){const x=rnd(W),y=rnd(H),r=rnd(r0,r1);b.moveTo(x+r,y);b.arc(x,y,r,0,TAU)}b.fill()}}
function blades(b,W,H,n,cols,l0,l1,lw=1){b.lineWidth=lw;b.lineCap='round';for(const col of cols){b.strokeStyle=col;b.beginPath();for(let i=0;i<n/cols.length;i++){const x=rnd(W),y=rnd(H);b.moveTo(x,y);b.lineTo(x+rnd(-l1*.4,l1*.4),y-rnd(l0,l1))}b.stroke()}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function glowSprite(r,g,b,size=64){const c=offscreen(size,size),x=c.getContext('2d'),h=size/2,gr=x.createRadialGradient(h,h,0,h,h,h);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.22,`rgba(${r},${g},${b},.5)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,size,size);return c}

// graella espacial per a consultes de veïns
function makeGrid(cs){return{cs,cols:1,rows:1,head:new Int32Array(1),next:new Int32Array(1),items:[],
  build(items,W,H){this.items=items;this.cols=Math.max(1,Math.ceil(W/cs));this.rows=Math.max(1,Math.ceil(H/cs));const n=this.cols*this.rows;
    if(this.head.length<n)this.head=new Int32Array(n);this.head.fill(-1,0,n);if(this.next.length<items.length)this.next=new Int32Array(items.length*2+8);
    for(let i=0;i<items.length;i++){const c=this.cell(items[i].x,items[i].y);this.next[i]=this.head[c];this.head[c]=i}},
  cell(x,y){const cx=clamp(Math.floor(x/cs),0,this.cols-1),cy=clamp(Math.floor(y/cs),0,this.rows-1);return cy*this.cols+cx},
  each(x,y,r,fn){const c0=clamp(Math.floor((x-r)/cs),0,this.cols-1),c1=clamp(Math.floor((x+r)/cs),0,this.cols-1),r0=clamp(Math.floor((y-r)/cs),0,this.rows-1),r1=clamp(Math.floor((y+r)/cs),0,this.rows-1);
    for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){let i=this.head[cy*this.cols+cx];while(i!==-1){fn(this.items[i]);i=this.next[i]}}}}}
// boids: separació, alineació, cohesió → b.ax, b.ay
function flock(b,grid,o){let n=0,cx=0,cy=0,vx=0,vy=0,sx=0,sy=0;const r2=o.r*o.r,sr=o.sepR,sr2=sr*sr,maxN=o.maxN||12;
  grid.each(b.x,b.y,o.r,q=>{if(q===b||n>=maxN)return;const dx=q.x-b.x,dy=q.y-b.y,d2=dx*dx+dy*dy;if(d2>r2)return;
    n++;cx+=dx;cy+=dy;vx+=q.vx;vy+=q.vy;if(d2<sr2){const dd=Math.sqrt(d2)||.01,k=(sr-dd)/sr/dd;sx-=dx*k;sy-=dy*k}});
  b.ax=0;b.ay=0;if(n){b.ax=(vx/n-b.vx)*o.ali+cx/n*o.coh+sx*o.sep;b.ay=(vy/n-b.vy)*o.ali+cy/n*o.coh+sy*o.sep}}

// ───────────── ESCENES
const SCENES=[];

// 1 · Banc de peixos
SCENES.push({id:'peixos',group:'fugen',name:'Banc de peixos',latin:'Sardina pilchardus',blurb:'Esquiven el dit. També els pots donar menjar.',
hint:'Passa el dit pel mig del banc i mira com s’obre. Amb «Donar menjar», toca per tirar escates.',
tools:[{id:'espantar',label:'Espantar'},{id:'menjar',label:'Donar menjar'}],
make(W,H,api){const d=api.dpr,grid=makeGrid(48),fish=[],food=[];
  const bg=layer(W,H,d,b=>{const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a7f97');g.addColorStop(.5,'#145673');g.addColorStop(1,'#0a2f45');b.fillStyle=g;b.fillRect(0,0,W,H);
    for(let i=0;i<50;i++)blob(b,rnd(W),rnd(H),rnd(30,120),'170,230,255',.05)});
  const N=Math.round(clamp(W*H/2200,50,240));
  for(let i=0;i<N;i++){const a=rnd(-.6,.6);fish.push({x:W/2+rnd(-W*.3,W*.3),y:H/2+rnd(-H*.2,H*.2),vx:Math.cos(a)*50,vy:Math.sin(a)*50,ax:0,ay:0,a,ph:rnd(TAU),w:rnd(TAU),s:rnd(.75,1.25),fear:0})}
  const F={r:48,sepR:14,sep:500,ali:2.2,coh:1.1,maxN:10};let t=0,lx=-1e9,ly=0;
  const drop=(x,y,n)=>{for(let i=0;i<n;i++)food.push({x:x+rnd(-16,16),y:y+rnd(-16,16),age:0,ph:rnd(TAU)});if(food.length>150)food.splice(0,food.length-150)};
  return{
    update(dt){t+=dt;grid.build(fish,W,H);const scare=api.tool!=='menjar';
      for(const f of fish){flock(f,grid,F);softBounds(f,W,H,50,5);
        f.ax+=Math.cos(f.w+t*.5)*22;f.ay+=Math.sin(f.w*1.3+t*.4)*22;
        let fear=0;
        if(scare)for(const p of api.pointers){const dx=f.x-p.x,dy=f.y-p.y,dd=Math.hypot(dx,dy)||1;if(dd<125){const k=1-dd/125;f.ax+=dx/dd*k*2800;f.ay+=dy/dd*k*2800;if(k>fear)fear=k}}
        if(food.length){let best=null,bd=230;for(const o of food){const dd=Math.hypot(o.x-f.x,o.y-f.y);if(dd<bd){bd=dd;best=o}}
          if(best){f.ax+=(best.x-f.x)/(bd+1)*320;f.ay+=(best.y-f.y)/(bd+1)*320;if(bd<6)best.eaten=1}}
        f.fear=Math.max(fear,f.fear-dt*1.4);f.vx+=f.ax*dt;f.vy+=f.ay*dt;
        const sp=limit(f,28,80+f.fear*240);f.x+=f.vx*dt;f.y+=f.vy*dt;f.ph+=dt*(4+sp*.1);f.a=Math.atan2(f.vy,f.vx)}
      for(const o of food){o.age+=dt;o.y+=dt*8;o.x+=Math.sin(o.age*2+o.ph)*dt*5}
      prune(food,o=>o.eaten||o.age>25||o.y>H+8)},
    draw(c){c.drawImage(bg,0,0,W,H);
      c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(140,210,235,.04)';
      for(let i=0;i<4;i++){const x=W*(i+.5)/4+Math.sin(t*.25+i*1.7)*40;c.beginPath();c.moveTo(x-25,0);c.lineTo(x+25,0);c.lineTo(x+120,H);c.lineTo(x+10,H);c.fill()}c.restore();
      c.fillStyle='#ecd28c';for(const o of food)c.fillRect(o.x-1.5,o.y-1.5,3,3);
      c.fillStyle='rgba(3,25,40,.26)';c.beginPath();for(const f of fish){T(c,d,f.x+6,f.y+9,f.a);E(c,0,0,10*f.s,3*f.s)}c.setTransform(d,0,0,d,0,0);c.fill();
      c.fillStyle='#7fa9b8';c.beginPath();for(const f of fish){const L=10*f.s,w=3.3*f.s,sw=Math.sin(f.ph)*w*1.1;T(c,d,f.x,f.y,f.a);c.moveTo(-L*.8,0);c.lineTo(-L*1.55,-w*1.25+sw);c.lineTo(-L*1.55,w*1.25+sw);c.closePath()}c.setTransform(d,0,0,d,0,0);c.fill();
      c.fillStyle='#d6e6ea';c.beginPath();for(const f of fish){T(c,d,f.x,f.y,f.a);E(c,0,0,10*f.s,3.3*f.s)}c.setTransform(d,0,0,d,0,0);c.fill();
      c.fillStyle='#3f7890';c.beginPath();for(const f of fish){T(c,d,f.x,f.y,f.a);E(c,.5*f.s,0,7.5*f.s,1.25*f.s)}c.setTransform(d,0,0,d,0,0);c.fill()},
    down(p){if(api.tool==='menjar'){drop(p.x,p.y,8);lx=p.x;ly=p.y}},
    move(p){if(api.tool==='menjar'&&Math.hypot(p.x-lx,p.y-ly)>36){drop(p.x,p.y,3);lx=p.x;ly=p.y}},
    stats(){return pl(fish.length,'sardina','sardines')+(food.length?` · ${pl(food.length,'escata','escates')}`:'')}}}});

// 2 · Formiguer
SCENES.push({id:'formigues',group:'eco',name:'Formiguer',latin:'Lasius niger',blurb:'Posa sucre, mira com es formen els camins i aixafa’n alguna.',
hint:'Amb «Menjar», toca o arrossega per deixar sucre. Les formigues marquen el camí amb feromones (taronja: cap al menjar; lila: cap al niu).',
tools:[{id:'menjar',label:'Menjar'},{id:'treure',label:'Treure'},{id:'aixafar',label:'Aixafar'}],
make(W,H,api){const d=api.dpr,CS=6,cols=Math.ceil(W/CS),rows=Math.ceil(H/CS),NC=cols*rows;
  const home=new Float32Array(NC),trail=new Float32Array(NC),food=new Float32Array(NC);
  const nest={x:W/2,y:H*.56};
  const bg=layer(W,H,d,b=>{b.fillStyle='#8a6a48';b.fillRect(0,0,W,H);
    for(let i=0;i<60;i++)blob(b,rnd(W),rnd(H),rnd(40,140),pick(['70,50,30','160,125,85']),.18);
    speckle(b,W,H,W*H/90,['rgba(60,42,26,.5)','rgba(175,140,100,.45)','rgba(110,84,58,.6)'],.5,1.8);
    for(let i=0;i<W*H/9000;i++){const x=rnd(W),y=rnd(H),r=rnd(3,8),a=rnd(TAU);b.fillStyle='rgba(40,28,16,.35)';b.beginPath();b.ellipse(x+1.5,y+2,r,r*.75,a,0,TAU);b.fill();
      b.fillStyle=pick(['#a39684','#8c8070','#b5a690']);b.beginPath();b.ellipse(x,y,r,r*.75,a,0,TAU);b.fill();b.fillStyle='rgba(255,255,255,.18)';b.beginPath();b.ellipse(x-r*.3,y-r*.3,r*.4,r*.25,a,0,TAU);b.fill()}
    blob(b,nest.x,nest.y,48,'120,90,60',.7);
    for(let i=0;i<110;i++){const a=rnd(TAU),r=rnd(10,32);b.fillStyle=pick(['#7a5a3a','#9c7a52','#6a4c30']);b.beginPath();b.arc(nest.x+Math.cos(a)*r,nest.y+Math.sin(a)*r,rnd(1,2.4),0,TAU);b.fill()}

      c.fillStyle='#f4f0e6';c.beginPath();for(const s of sh){T(c,d,s.x,s.y,s.a);O(c,-2,0,5.6);O(c,1.5,-2.2,4.2);O(c,1.5,2.2,4.2);O(c,-4.5,-2,3.8);O(c,-4.5,2,3.8)}c.setTransform(d,0,0,d,0,0);c.fill();
      c.fillStyle='#2a2522';c.beginPath();for(const s of sh){T(c,d,s.x,s.y,s.a);E(c,6.5,0,3.2,2.2);E(c,5.3,-2.6,1.6,.8);E(c,5.3,2.6,1.6,.8)}c.setTransform(d,0,0,d,0,0);c.fill();
      const w=Math.sin(dog.wag)*3;T(c,d,dog.x,dog.y,dog.a,1.15);
      c.fillStyle='#1e1c1d';c.beginPath();E(c,-10,w,4,1.4);E(c,-1,0,8,4.2);O(c,7.5,0,3.3);E(c,6.5,-2.8,1.8,1.1);E(c,6.5,2.8,1.8,1.1);c.fill();
      c.fillStyle='#f2efe8';c.beginPath();E(c,3.5,0,2.2,4.2);E(c,8.6,0,2.1,.8);O(c,-13.6,w*1.15,1.3);c.fill();c.setTransform(d,0,0,d,0,0)},
    stats(){return `Al corral ${inside}/${sh.length} · ${fmt(el)}`}}}});

// 11 · Krill i balena
SCENES.push({id:'krill',group:'joc',name:'Krill i balena',latin:'Euphausia superba · Megaptera novaeangliae',blurb:'Toca on hi ha krill: una balena geperuda puja a empassar-se’l.',
hint:'Toca la pantalla: una balena geperuda fa una xarxa de bombolles i surt del fons amb la boca oberta. Apunta on el krill és més dens.',
make(W,H,api){const d=api.dpr,N=Math.round(clamp(W*H/300,400,1500)),kr=[],wh=[],foam=[];let t=0,eaten=0,regen=0;
  const S=[0,1,2].map(i=>({x:W/2,y:H/2,i}));const sw=s=>{s.x=W*(.5+.3*Math.sin(t*.09*(s.i+1)+s.i*2.1));s.y=H*(.5+.3*Math.sin(t*.07*(s.i+1.4)+s.i*1.3))};S.forEach(sw);
  const bg=layer(W,H,d,b=>{const g=b.createLinearGradient(0,0,W*.3,H);g.addColorStop(0,'#0f5b70');g.addColorStop(1,'#062636');b.fillStyle=g;b.fillRect(0,0,W,H);
    for(let i=0;i<40;i++)blob(b,rnd(W),rnd(H),rnd(40,150),pick(['120,210,230','4,20,30']),.08)});
  const addK=(s,r0,r1)=>{const a=rnd(TAU),r=rnd(r0,r1);kr.push({x:s.x+Math.cos(a)*r,y:s.y+Math.sin(a)*r,vx:0,vy:0,s:s.i,ph:rnd(TAU),dead:false})};
  for(let i=0;i<N;i++)addK(S[i%3],0,70);
  return{
    update(dt){t+=dt;S.forEach(sw);
      for(const k of kr){const s=S[k.s],dx=s.x-k.x,dy=s.y-k.y,dd=Math.hypot(dx,dy)||1,m=Math.min(dd,140)*1.2;
        let ax=dx/dd*m-dy/dd*35+Math.sin(t*2+k.ph)*25,ay=dy/dd*m+dx/dd*35+Math.cos(t*1.7+k.ph)*25;
        for(const w of wh)if(w.st==='rise'||w.st==='open'){const ex=k.x-w.x,ey=k.y-w.y,ed=Math.hypot(ex,ey)||1;if(ed<w.R*1.6){const f=(1-ed/(w.R*1.6))*160;ax+=ex/ed*f;ay+=ey/ed*f}}
        k.vx+=ax*dt;k.vy+=ay*dt;k.vx*=1-dt*1.1;k.vy*=1-dt*1.1;k.x+=k.vx*dt;k.y+=k.vy*dt}
      for(const w of wh){w.t+=dt;
        if(w.st==='rise'){if(w.t>.9){w.st='open';w.t=0}}
        else if(w.st==='open'){w.o=Math.min(1,w.t/.35);const r=w.R*w.o*.92;for(const k of kr)if(!k.dead){const dx=k.x-w.x,dy=k.y-w.y;if(dx*dx+dy*dy<r*r){k.dead=true;eaten++}}
          if(w.t>.5){w.st='close';w.t=0;for(let j=0;j<40;j++){const a=rnd(TAU),sp=rnd(30,110);foam.push({x:w.x+Math.cos(a)*w.R,y:w.y+Math.sin(a)*w.R,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:rnd(2,5)})}}}
        else if(w.st==='close'){w.o=Math.max(0,1-w.t/.6);if(w.t>.6){w.st='sink';w.t=0}}
        else if(w.st==='sink'&&w.t>1.4)w.gone=true}
      prune(wh,w=>w.gone);prune(kr,k=>k.dead);
      if(kr.length<N){regen+=dt*N*.025;while(regen>=1&&kr.length<N){regen--;addK(pick(S),40,110)}}else regen=0;
      for(const f of foam){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=1-dt*2;f.vy*=1-dt*2;f.life-=dt*.7;f.r+=dt*3}prune(foam,f=>f.life<=0)},
    draw(c){c.drawImage(bg,0,0,W,H);
      for(const w of wh){const a=w.st==='rise'?Math.min(1,w.t/.9)*.55:w.st==='sink'?.55*(1-w.t/1.4):.55;c.fillStyle=`rgba(3,16,24,${a.toFixed(3)})`;c.beginPath();c.ellipse(w.x,w.y+w.R*.7,w.R*.95,w.R*1.9,w.a,0,TAU);c.fill();
        if(w.st==='rise'){c.fillStyle=`rgba(220,245,255,${(.7*Math.min(1,w.t/.4)).toFixed(3)})`;c.beginPath();for(let i=0;i<34;i++){const an=i/34*TAU+w.t*.8,r=w.R*1.15+Math.sin(i*3.7)*6;O(c,w.x+Math.cos(an)*r,w.y+Math.sin(an)*r,1.5+((i*7)%3))}c.fill()}}
      c.fillStyle='rgba(30,10,10,.25)';for(const k of kr)c.fillRect(k.x+1,k.y+2,2.2,2.2);
      c.fillStyle='#ff9b73';for(const k of kr)c.fillRect(k.x-1,k.y-1,2.2,2.2);
      for(const w of wh){const o=w.st==='open'||w.st==='close'?w.o:0;if(o<.02)continue;const R=w.R;
        c.fillStyle='#2b3945';c.beginPath();c.ellipse(w.x,w.y,R*(.55+.5*o),R*(.75+.35*o),w.a,0,TAU);c.fill();
        c.fillStyle='#c97b7a';c.beginPath();c.ellipse(w.x,w.y,R*.92*o,R*.95*o,w.a,0,TAU);c.fill();
        c.strokeStyle='rgba(120,50,55,.55)';c.lineWidth=1.2;c.beginPath();for(let i=-3;i<=3;i++){const x=w.x+i*R*.22*o;c.moveTo(x,w.y-R*.7*o);c.lineTo(x,w.y+R*.7*o)}c.stroke();
        c.strokeStyle='#3c2f27';c.lineWidth=4;c.setLineDash([2,2]);c.beginPath();c.ellipse(w.x,w.y,R*.95*o,R*.98*o,w.a,0,TAU);c.stroke();c.setLineDash([]);
        c.fillStyle='#4a5a66';c.beginPath();for(let i=0;i<12;i++){const an=-Math.PI*.85+i/11*Math.PI*.7;O(c,w.x+Math.cos(an)*R*(.55+.5*o)*.88,w.y+Math.sin(an)*R*(.75+.35*o)*.88,2.2)}c.fill();
        c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=3;c.beginPath();c.ellipse(w.x,w.y,R*(.58+.5*o),R*(.78+.35*o),w.a,0,TAU);c.stroke()}
      c.fillStyle='#fff';for(const f of foam){c.globalAlpha=f.life*.75;c.beginPath();c.arc(f.x,f.y,f.r,0,TAU);c.fill()}c.globalAlpha=1},
    down(p){if(wh.length<3)wh.push({x:p.x,y:p.y,t:0,st:'rise',o:0,R:clamp(Math.min(W,H)*.2,50,105),a:rnd(-.4,.4)})},
    stats(){return `${kr.length} krill · ${eaten} engolits`}}}});

// ───────────── MOTOR I INTERFÍCIE
const GROUPS=[['fugen','Fugen del dit'],['eco','Ecosistemes'],['calma','Per relaxar-se'],['joc','Mini-jocs']];
const $=id=>document.getElementById(id);
const menu=$('menu'),sceneEl=$('scene'),cv=$('cv'),ctx=cv.getContext('2d'),toastEl=$('toast'),statsEl=$('stats'),toolsEl=$('tools'),actsEl=$('acts');
const probeT=document.createElement('div'),probeB=document.createElement('div');
probeT.style.cssText='position:fixed;left:0;top:0;width:0;visibility:hidden;height:env(safe-area-inset-top,0px)';
probeB.style.cssText='position:fixed;left:0;top:0;width:0;visibility:hidden;height:env(safe-area-inset-bottom,0px)';
document.body.append(probeT,probeB);

let toastTimer=0;
function toast(msg,ms=5000){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),ms)}
const api={pointers:[],dpr:1,safeTop:0,safeBottom:0,tool:null,thumb:false,toast};
let W=0,H=0,cur=null,curDef=null,last=0,statT=0,wake=null;

// menú
const thumbs=[];
const groupsEl=$('groups');
for(const [gid,gname] of GROUPS){const sec=document.createElement('section');const h=document.createElement('h2');h.textContent=gname;const grid=document.createElement('div');grid.className='grid';sec.append(h,grid);
  for(const def of SCENES.filter(s=>s.group===gid)){const b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label',`${def.name}: ${def.blurb}`);
    const c=document.createElement('canvas');c.className='thumb';c.width=360;c.height=240;thumbs.push([def,c]);
    const m=document.createElement('div');m.className='meta';const n=document.createElement('b');n.textContent=def.name;const l=document.createElement('i');l.textContent=def.latin;const s=document.createElement('span');s.textContent=def.blurb;m.append(n,l,s);
    b.append(c,m);b.addEventListener('click',()=>open(def));grid.append(b)}
  groupsEl.append(sec)}
function renderThumbs(){let i=0;const next=()=>{if(i>=thumbs.length)return;const [def,c]=thumbs[i++];
  try{const ta={pointers:[],dpr:1,safeTop:0,safeBottom:0,thumb:true,tool:def.tools?def.tools[0].id:null,toast(){}};const inst=def.make(c.width,c.height,ta);
    const steps=def.thumbSteps??90;for(let k=0;k<steps;k++)inst.update(1/30);const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);inst.draw(x)}catch(e){console.error(def.id,e)}
  setTimeout(next,20)};next()}
renderThumbs();


function fit(){api.dpr=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*api.dpr);cv.height=Math.round(H*api.dpr);api.safeTop=probeT.offsetHeight;api.safeBottom=probeB.offsetHeight}
function start(){api.pointers.length=0;cur=curDef.make(W,H,api);last=performance.now();statT=1}
function open(def){curDef=def;api.tool=def.tools?def.tools[0].id:null;
  $('sname').textContent=def.name;$('slatin').textContent=def.latin;
  toolsEl.replaceChildren(...(def.tools||[]).map(t=>{const b=document.createElement('button');b.type='button';b.textContent=t.label;b.setAttribute('aria-pressed',String(t.id===api.tool));
    b.addEventListener('click',()=>{api.tool=t.id;for(const x of toolsEl.children)x.setAttribute('aria-pressed',String(x===b))});return b}));
  actsEl.replaceChildren(...(def.actions||[]).map(a=>{const b=document.createElement('button');b.type='button';b.textContent=a.label;b.addEventListener('click',()=>cur&&a.run(cur));return b}));
  menu.hidden=true;sceneEl.hidden=false;fit();start();toast(def.hint,6000);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{wake=l}).catch(()=>{})}catch(e){}}
function close(){cur=null;curDef=null;sceneEl.hidden=true;menu.hidden=false;toastEl.classList.remove('on');try{wake&&wake.release();wake=null}catch(e){}}
$('back').addEventListener('click',close);
$('reset').addEventListener('click',()=>{if(curDef)start()});
$('info').addEventListener('click',()=>{if(curDef)toast(curDef.hint,7000)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)close()});
let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(!cur)return;const ow=W,oh=H;fit();if(Math.abs(W-ow)>40||Math.abs(H-oh)>40)start()},150)});

// punters (multitàctil + ratolí)
const byId=id=>api.pointers.find(p=>p.id===id);
cv.addEventListener('pointerdown',e=>{if(!cur)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  let p=byId(e.pointerId);if(!p){p={id:e.pointerId,x:e.clientX,y:e.clientY,vx:0,vy:0,lm:performance.now(),down:true};api.pointers.push(p)}
  p.down=true;p.x=e.clientX;p.y=e.clientY;cur.down&&cur.down(p)});
cv.addEventListener('pointermove',e=>{if(!cur)return;let p=byId(e.pointerId);
  if(!p){if(e.pointerType!=='mouse')return;p={id:e.pointerId,x:e.clientX,y:e.clientY,vx:0,vy:0,lm:performance.now(),down:false};api.pointers.push(p)}
  const now=performance.now(),dts=Math.max(4,now-p.lm)/1000;p.vx=p.vx*.4+(e.clientX-p.x)/dts*.6;p.vy=p.vy*.4+(e.clientY-p.y)/dts*.6;p.x=e.clientX;p.y=e.clientY;p.lm=now;
  if(p.down&&cur.move)cur.move(p)});
const lift=e=>{const p=byId(e.pointerId);if(!p)return;if(cur&&cur.up)cur.up(p);
  if(e.pointerType==='mouse'&&e.type==='pointerup')p.down=false;else api.pointers.splice(api.pointers.indexOf(p),1)};
cv.addEventListener('pointerup',lift);cv.addEventListener('pointercancel',lift);cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')lift(e)});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function frame(now){requestAnimationFrame(frame);if(!cur)return;const dt=Math.min(.034,Math.max(.001,(now-last)/1000));last=now;
  for(const p of api.pointers)if(now-p.lm>60){p.vx*=.7;p.vy*=.7}
  cur.update(dt);ctx.setTransform(api.dpr,0,0,api.dpr,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';cur.draw(ctx);
  if((statT+=dt)>.25){statT=0;const s=cur.stats?cur.stats():'';statsEl.textContent=s;statsEl.hidden=!s}}
requestAnimationFrame(frame);
})();
</script>
